<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مدار</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="authScreen" style="display:none"></div>

  <div id="app" style="display:none">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-company" id="brandCompany"></div>
        <div class="brand-app">
          <span class="brand-icon">🚚</span>
          <span class="brand-text">مدار لإدارة التوزيع والإنتاج</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="topbar-title" id="pageTitle">لوحة التحكم</div>
        <div class="context-switcher" id="contextSwitcher">
          <select id="companySelect" title="المنشأة"></select>
          <select id="branchSelect" title="الفرع"></select>
        </div>
        <div class="topbar-date" id="topDate"></div>
        <div class="topbar-user" id="topUser"></div>
        <button class="btn secondary small" id="logoutBtn" title="تسجيل الخروج">خروج</button>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="js/context.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/customers.js"></script>
  <script src="js/pages/suppliers.js"></script>
  <script src="js/pages/products.js"></script>
  <script src="js/pages/purchases.js"></script>
  <script src="js/pages/production.js"></script>
  <script src="js/pages/vehicles.js"></script>
  <script src="js/pages/warehouses.js"></script>
  <script src="js/pages/contracts.js"></script>
  <script src="js/pages/customer-pricing.js"></script>
  <script src="js/pages/trips.js"></script>
  <script src="js/pages/sales.js"></script>
  <script src="js/pages/damages.js"></script>
  <script src="js/pages/expenses.js"></script>
  <script src="js/pages/vouchers.js"></script>
  <script src="js/pages/treasury.js"></script>
  <script src="js/pages/employees.js"></script>
  <script src="js/pages/accounting.js"></script>
  <script src="js/pages/maps.js"></script>
  <script src="js/pages/stock-ops.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/print.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
