services:
  - type: web
    name: distribution-erp
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: distribution
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.9.0
    disk:
      name: distribution-data
      mountPath: /opt/render/project/src/distribution/data
      sizeGB: 1
